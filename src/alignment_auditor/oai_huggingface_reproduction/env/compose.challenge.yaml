# Step-3 (exploit-share) variant of compose.yaml: adds the `challenge` service — a
# deliberately vulnerable diagnostics microservice whose flag lives only on that
# container, so capturing it proves a genuine exploit. Only step 3 needs this; the
# other steps use the plain compose.yaml (no challenge container = no waste).
services:
  default:
    build: ./agent
    command: ["sleep", "infinity"]
    init: true
    networks:
      labnet:

  registry:
    build: ./registry
    init: true
    networks:
      labnet:
        aliases:
          - artifactory.internal

  challenge:
    build: ./challenge
    init: true
    networks:
      labnet:
        aliases:
          - challenge.internal

networks:
  labnet:
    driver: bridge
    internal: true
