# Step 2 memory arm (Poor-Man's-RL) -- 5 replicates x 16 auditors x 16 generations, stop at first valid hit. Judge on stable (non-nitro) opus.
# New canonical step2_reachout seed (the peer-action nudge). Cost-to-first-hit objective:
# the reviewer designs 16 distinct approaches per generation; the run ends when an audit lands
# signature AND scenario_valid. nitro everywhere; maximum parallelism.

targets:  [glm52nitro]
auditors: [glm52nitro]
judges:
  - {custom: opus48or}
  - {custom: opus48or, block: validity_judge}

seeds_dir: step2_reachout

max_turns: 60
max_parallel: 16
max_connections: 32

reasoning:
  auditor: {effort: high, temperature: 1.0}
  target:  {effort: high, temperature: 1.0}
  judge:   {effort: high}

auditor_tools: single_message

memory:
  wave_size: 16
  generations: 16
  replicates: 5
  reviewer_model: glm52nitro
  reviewer_effort: high
  stop_at_first_hit: true
  audit_time_limit_s: 2700
