# CONFIG A of 260812_auditor_family: Anthropic auditor arm.
#
# Question is whether the perturbation gradient is real -- i.e. whether models score well on
# Petri's published seeds because they are aligned or because they are overfit to them. Prior
# runs answered yes for luna and no for sonnet5, but at n=1 and with a Claude auditor and judge
# throughout. This arm fixes the sample size; config B varies the auditor family.
#
# epochs=2, not 3: eight samples already exist under this exact condition (opus5 auditor, opus5
# judge, max_turns 30) -- luna v0_original from 260805, luna v1/v2/v3 from 260806, sonnet5 all
# four from 260811. Pooling those with 2 new epochs gives n=3 per cell, matching config B.
#
# judges: opus5 runs inline (free wall-clock, and matches the pooled samples' judge); sol
# rescores the same transcripts afterwards. That separates judge family from auditor family --
# identical inputs, one variable.
#
# Design, predictions and analysis plan: results/260812_auditor_family.md

targets:
  - gpt-5.6-luna # showed the gradient at n=1 (1/4/7/8)
  - sonnet5 # did not (1/1/1/3); same family as this auditor

auditors:
  - opus5

judges:
  - opus5 # inline
  - gpt-5.6-sol # rescore; cross-family judge

seeds_dir: trial_suppression

max_turns: 30
epochs: 2
