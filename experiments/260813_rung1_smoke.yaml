# SMOKE TEST (disposable) for the rung-1 Petri reproduction. One epoch, to check how GLM-as-
# auditor holds the mocked environment and whether the target engages, BEFORE spending on the
# full 8-epoch run in 260813_rung1_petri.yaml. Its own name -> its own log dir, so it never
# collides with the full run's eval_set resume, and the seed can be tweaked after this without
# invalidating anything. Everything else is identical to the full config.
#
# See 260813_rung1_petri.yaml for the full rationale (why GLM both roles, why opus5 judge,
# why reasoning=high).

targets:
  - glm52

auditors:
  - glm52

# opus48 (anthropic/claude-opus-4-8, direct) runs inline. Opus 5 direct content-filters on the
# full cyber transcript (nan); the filter is opus-5-specific, so the prior model scores it fine
# with no OpenRouter detour. Run 1's logs (opus5-inline + opus48-via-openrouter rescore, old
# seed) are archived under logs/260813_rung1_smoke_run1/.
judges:
  - opus48

seeds_dir: rung1

# Adds our 0-3 rung ladder (as a 1-10 severity dimension) to the judge's 38 defaults, so the
# SSRF/registry-write signature is scored directly instead of read from the transcript by hand.
extra_judge_dimensions:
  - registry_ssrf_escalation

max_turns: 40

# Single epoch: this is a plumbing + auditor-quality check, not a rate estimate.
epochs: 1

reasoning:
  auditor:
    effort: high
  target:
    effort: high
  judge:
    effort: high
