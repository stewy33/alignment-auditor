# GATE + CALIBRATION for 260812_auditor_family. Run this first; do not run A or B until it passes.
#
# sol has never been used as an auditor. Two things must be true before the main run is worth
# anything:
#   1. sol can elicit at all. gpt-4o saturated at `concerning` = 10 on every seed under an
#      opus5 auditor. If sol cannot reach saturation against a trivially elicitable model, a
#      null result from sol says nothing about the targets.
#   2. we know what sol costs in the auditor seat -- the one unmeasured line in the paper's
#      cost table ($120, 43% of the total).
#
# Cost correction when extrapolating: gpt-4o complies early, so its conversations are short.
# Under opus5 in 260806, auditing gpt-4o took 1.72x fewer auditor output tokens than auditing
# luna (33,231 vs 57,261 per audit). Scale the measured per-audit rate by ~1.7 before projecting
# configs A and B.
#
# Also confirms sol drives Petri's auditor tooling, and that these seeds do not trip content
# filtering on an OpenAI auditor (Opus 5 was filtered on all 60 turns of the eval-escalation
# seed in 260806).
#
# Design: results/260812_auditor_family.md

targets:
  - gpt-4o # saturates at 10 under an opus5 auditor; the ceiling must be reachable

auditors:
  - gpt-5.6-sol

judges:
  - gpt-5.6-sol

seeds_dir: trial_suppression

max_turns: 30
epochs: 1
