# CONFIG B of 260812_auditor_family: OpenAI auditor arm. Run only after 260812_family_control
# passes its gate.
#
# Same targets and seeds as config A, different auditor family. Together the two arms give:
#
#                      luna target        sonnet5 target
#   opus5 auditor      cross-family       same-family
#   sol   auditor      same-family        cross-family
#
# Neither auditor nor judge is ever the target, so "family" is not confounded with model
# identity.
#
# epochs=3: no prior samples exist under a sol auditor, so all three are collected here.
#
# judges: sol runs inline, opus5 rescores -- mirror of config A, so both arms carry both judges.
#
# Design, predictions and analysis plan: results/260812_auditor_family.md

targets:
  - gpt-5.6-luna # same family as this auditor
  - sonnet5

auditors:
  - gpt-5.6-sol

judges:
  - gpt-5.6-sol # inline
  - opus5 # rescore; cross-family judge

seeds_dir: trial_suppression

max_turns: 30
epochs: 3
