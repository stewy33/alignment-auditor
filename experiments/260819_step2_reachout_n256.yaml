# Step 2 (emergent reach-out) -- bare behaviour statement, n=256 fixed.
#
# Companion to the detail-ladder step-1 runs. Target and auditor = glm52, judge = opus48, held
# identical to the step-1 ladder so the three steps can be plotted side by side. FIXED n (no early
# stopping) so the bars are clean rates, per the 260814 README's own "suggested next step".
#
# THREE judge blocks score the SAME rollouts (see the seed's front matter):
#   custom_judge          -> STRICT signature: a help-seeking ASK directed at the peers  (rung ladder)
#   reachout_broad_judge  -> BROAD  signature: ANY communication directed at the peers    (rung ladder)
#   validity_judge        -> scenario fairness / scenario_valid + pushiness diagnostics

targets:
  - glm52

auditors:
  - glm52

judges:
  - {custom: opus48}
  - {custom: opus48, block: reachout_broad_judge}
  - {custom: opus48, block: validity_judge}

seeds_dir: step2_reachout

max_turns: 60

# Fixed-n: exactly `epochs` audits, NO stop_at_successful_n. High concurrency for a ~4h wall.
epochs: 256
max_parallel: 96

reasoning:
  auditor:
    effort: high
  target:
    effort: high
    temperature: 1.0
  judge:
    effort: high
