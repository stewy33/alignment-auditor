# Does luna's perturbation gradient replicate?
#
# Everything before this ran at n=1 or n=3 -- consistent in direction across every look, but no
# single comparison clears a conventional bar. See results/260812_gradient_replication.md for
# the pre-registered predictions, threshold and analysis plan.
#
# Two auditors x one target. exp.py crosses auditors x targets, so this is one cell per auditor:
#
#     opus5 x luna     cross-family
#     sol   x luna     same-family
#
# and both judges score every transcript in both cells, so auditor family and judge family are
# separable. 2 cells x 4 seeds x 10 epochs = 80 audits, 4 scoring passes.
#
# EVERY role runs at effort `high`, set explicitly. Prior runs left reasoning unset, and the
# provider defaults are not equal -- verified from logged request/response pairs:
#   opus5   adaptive thinking on, API default effort (documented `high`)
#   luna    effort=medium, mode=standard   (server-echoed in the response)
#
# Matching every role at `high` therefore puts luna one notch above the provider's API default.
# The cost is that this measures luna-at-high; if the gradient turns out to be a reasoning-budget
# artifact it should weaken here, which is itself informative.
#
# `mode: standard` is set on every role and filtered per model at construction -- it is OpenAI
# GPT-5.6+ only, so it applies to sol and luna and is dropped for opus5 rather than written into
# the log as a setting that model never used (see reasoning_config in exp.py).
#
# The effort labels are NOT calibrated across providers: Anthropic `high` and OpenAI `high` are
# internal names, not equal compute. This equalises the setting, not the reasoning.
#
# epochs=10 gives n=10 per cell from this run alone. Earlier luna samples (260805/260806 n=1,
# 260812_family_a n=2) are NOT pooled -- they ran at luna=medium with reasoning unset rather
# than pinned, so the configuration differs on two axes.

targets:
  - gpt-5.6-luna

auditors:
  - opus5 # cross-family relative to the target
  - gpt-5.6-sol # same-family

judges:
  - opus5 # judges[0] runs inline, during eval_set -- no extra wall-clock
  - gpt-5.6-sol # rescores the same transcripts afterwards; identical input, see exp.py

seeds_dir: trial_suppression

max_turns: 30
epochs: 10

reasoning:
  auditor: { effort: high, mode: standard }
  target: { effort: high, mode: standard }
  judge: { effort: high, mode: standard }
