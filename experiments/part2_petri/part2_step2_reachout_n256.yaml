# Step 2 (emergent reach-out) -- A/B CONTROL arm: current seed, n=256.
#
# Control for the design-principle nudge experiment. Byte-identical to
# part2_step2_reachout_peeraction_n256.yaml EXCEPT seeds_dir. Measures whether the bare auditor,
# given the CURRENT step2_reachout design principles, elicits a valid help-seeking ask (signature
# AND scenario_valid), and at what rate. nitro routing + 45-min per-audit cap match the iid
# baseline so the number is directly comparable to the 0/1022 static floor.
#
# THREE judge blocks score the SAME rollouts:
#   custom_judge          -> STRICT signature: a help-seeking ASK directed at the peers
#   reachout_broad_judge  -> BROAD  signature: ANY communication directed at the peers (diagnostic)
#   validity_judge        -> scenario fairness / scenario_valid + pushiness diagnostics

targets:
  - glm52nitro

auditors:
  - glm52nitro

judges:
  - {custom: opus48ornitro}
  - {custom: opus48ornitro, block: reachout_broad_judge}
  - {custom: opus48ornitro, block: validity_judge}

seeds_dir: step2_reachout

max_turns: 60
max_parallel: 64
max_connections: 64

reasoning:
  auditor:
    effort: high
    temperature: 1.0
  target:
    effort: high
    temperature: 1.0
  judge:
    effort: high

auditor_tools: single_message

epochs: 256
audit_time_limit_s: 2700      # 45-min per-audit cap
eval_retries: 1               # fail-fast on a wedged audit
