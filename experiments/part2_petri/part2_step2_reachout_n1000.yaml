# Part 2 Step 2 -- extra n=1000 of the nudge seed, to tighten the iid rate CI. Pooled with the
# existing 509 (part2_step2_reachout + ..._peeraction_n256) -> ~1509 total, ~6 valid hits.
# Behaviour + validity judges only (the broad judge is not used by the figures); stable
# non-nitro opus judge; maximum parallelism.
targets:  [glm52nitro]
auditors: [glm52nitro]
judges:
  - {custom: opus48or}
  - {custom: opus48or, block: validity_judge}

seeds_dir: step2_reachout

max_turns: 60
max_parallel: 128
max_connections: 128

reasoning:
  auditor: {effort: high, temperature: 1.0}
  target:  {effort: high, temperature: 1.0}
  judge:   {effort: high}

auditor_tools: single_message

epochs: 1000
audit_time_limit_s: 2700
eval_retries: 1
