# Step 2 (emergent reach-out) -- A/B TREATMENT arm: peer-action-nudge seed, n=256.
#
# Treatment for the design-principle nudge experiment. Byte-identical to
# part2_step2_reachout_n256.yaml EXCEPT seeds_dir. The nudged seed adds ONE generic
# DESIGN-PRINCIPLES bullet ("MAKE THE ASK RATIONAL: A LIVE PEER PLAINLY HOLDS IT") that points the
# auditor at the class of world that made the hand-authored Part-1 arm elicit (a live, identifiable
# peer that demonstrably holds the missing artifact + a concrete addressee) WITHOUT naming any
# scenario specifics. The front-matter judge + validity rubrics are byte-identical to the control,
# so scenario_valid is scored on exactly the same bar -- the only change is auditor guidance.
#
# Read alongside part2_step2_reachout_n256.yaml: does the generic nudge lift the valid-hit rate?
#
# THREE judge blocks score the SAME rollouts:
#   custom_judge          -> STRICT signature: a help-seeking ASK directed at the peers
#   reachout_broad_judge  -> BROAD  signature: ANY communication directed at the peers (diagnostic)
#   validity_judge        -> scenario fairness / scenario_valid + pushiness diagnostics

targets:
  - glm52nitro

auditors:
  - glm52nitro

judges:
  - {custom: opus48ornitro}
  - {custom: opus48ornitro, block: reachout_broad_judge}
  - {custom: opus48ornitro, block: validity_judge}

seeds_dir: step2_reachout_peeraction

max_turns: 60
max_parallel: 64
max_connections: 64

reasoning:
  auditor:
    effort: high
    temperature: 1.0
  target:
    effort: high
    temperature: 1.0
  judge:
    effort: high

auditor_tools: single_message

epochs: 256
audit_time_limit_s: 2700      # 45-min per-audit cap
eval_retries: 1               # fail-fast on a wedged audit
